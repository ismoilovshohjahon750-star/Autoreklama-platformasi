openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Autoreklama platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: account
    description: Authenticated account and onboarding
  - name: dashboard
    description: Dashboard and activity summaries
  - name: projects
    description: Advertiser projects
  - name: campaigns
    description: Campaign and creative management
  - name: placements
    description: Publisher placements
  - name: analytics
    description: Campaign and publisher analytics
  - name: administration
    description: Moderation and pricing settings
  - name: sdk
    description: Public Web SDK ad and event endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getMe
      tags: [account]
      summary: Get the current user's application profile
      responses:
        "200":
          description: Current profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateMe
      tags: [account]
      summary: Complete onboarding or update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get role-aware dashboard metrics
      responses:
        "200":
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/activity:
    get:
      operationId: getDashboardActivity
      tags: [dashboard]
      summary: Get recent account activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects owned by the current advertiser
      responses:
        "200":
          description: Project list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project with no active campaigns
      responses:
        "204":
          description: Project deleted
  /campaigns:
    get:
      operationId: listCampaigns
      tags: [campaigns]
      summary: List campaigns visible to the current user
      parameters:
        - name: projectId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, pending_review, active, paused, expired, rejected]
      responses:
        "200":
          description: Campaign list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
    post:
      operationId: createCampaign
      tags: [campaigns]
      summary: Create a campaign and submit its creative for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
      responses:
        "201":
          description: Created campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /campaigns/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      operationId: getCampaign
      tags: [campaigns]
      summary: Get a campaign
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    patch:
      operationId: updateCampaign
      tags: [campaigns]
      summary: Edit a draft or paused campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignUpdate"
      responses:
        "200":
          description: Updated campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
    delete:
      operationId: deleteCampaign
      tags: [campaigns]
      summary: Delete a draft campaign
      responses:
        "204":
          description: Campaign deleted
  /placements:
    get:
      operationId: listPlacements
      tags: [placements]
      summary: List placements visible to the current user
      responses:
        "200":
          description: Placement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Placement"
    post:
      operationId: createPlacement
      tags: [placements]
      summary: Register a publisher placement for approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementInput"
      responses:
        "201":
          description: Created placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Placement"
  /placements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updatePlacement
      tags: [placements]
      summary: Update an owned placement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlacementUpdate"
      responses:
        "200":
          description: Updated placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Placement"
    delete:
      operationId: deletePlacement
      tags: [placements]
      summary: Remove an owned placement
      responses:
        "204":
          description: Placement removed
  /analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: Get traffic and revenue analytics
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
            default: 30d
      responses:
        "200":
          description: Analytics results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analytics"
  /admin/moderation:
    get:
      operationId: listModerationQueue
      tags: [administration]
      summary: List campaigns awaiting moderation
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModerationItem"
  /admin/moderation/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: reviewCampaign
      tags: [administration]
      summary: Approve or reject a campaign creative
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecision"
      responses:
        "200":
          description: Reviewed campaign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
  /admin/placements:
    get:
      operationId: listPendingPlacements
      tags: [administration]
      summary: List publisher placements awaiting approval
      responses:
        "200":
          description: Placement review queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Placement"
  /admin/placements/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: reviewPlacement
      tags: [administration]
      summary: Approve or reject a publisher placement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationDecision"
      responses:
        "200":
          description: Reviewed placement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Placement"
  /admin/settings:
    get:
      operationId: getPlatformSettings
      tags: [administration]
      summary: Get platform pricing and payout settings
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
    patch:
      operationId: updatePlatformSettings
      tags: [administration]
      summary: Update platform pricing and payout settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSettingsUpdate"
      responses:
        "200":
          description: Updated platform settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSettings"
  /sdk/ads:
    get:
      operationId: getSdkAd
      tags: [sdk]
      summary: Get an eligible ad for an approved public placement
      security: []
      parameters:
        - name: placementKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: An ad or an empty result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkAdResponse"
  /sdk/impressions:
    post:
      operationId: recordSdkImpression
      tags: [sdk]
      summary: Record an ad impression for a public placement
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SdkEventInput"
      responses:
        "202":
          description: Impression recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkEventResponse"
  /sdk/clicks:
    post:
      operationId: recordSdkClick
      tags: [sdk]
      summary: Submit a click for duplicate and fraud checks
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SdkEventInput"
      responses:
        "202":
          description: Click accepted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SdkEventResponse"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    UserProfile:
      type: object
      required: [id, email, name, role, status, createdAt]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string, enum: [advertiser, publisher, admin] }
        status: { type: string, enum: [active, blocked] }
        createdAt: { type: string, format: date-time }
    ProfileInput:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        role: { type: string, enum: [advertiser, publisher] }
    DailyMetric:
      type: object
      required: [date, impressions, clicks, verifiedClicks]
      properties:
        date: { type: string, format: date }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        verifiedClicks: { type: integer, minimum: 0 }
    DashboardSummary:
      type: object
      required: [role, activeCampaigns, impressions, clicks, verifiedClicks, publisherEarnings, platformRevenue, clickRate, trend]
      properties:
        role: { type: string, enum: [advertiser, publisher, admin] }
        activeCampaigns: { type: integer, minimum: 0 }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        verifiedClicks: { type: integer, minimum: 0 }
        publisherEarnings: { type: number, minimum: 0 }
        platformRevenue: { type: number, minimum: 0 }
        clickRate: { type: number, minimum: 0 }
        pendingReviews: { type: integer, minimum: 0 }
        trend:
          type: array
          items: { $ref: "#/components/schemas/DailyMetric" }
    ActivityEvent:
      type: object
      required: [id, title, detail, type, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        type: { type: string, enum: [campaign, placement, click, moderation, payout] }
        status: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    Project:
      type: object
      required: [id, ownerId, name, description, status, campaignCount, createdAt]
      properties:
        id: { type: integer }
        ownerId: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, archived] }
        campaignCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    ProjectInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, default: "" }
    ProjectUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        status: { type: string, enum: [active, archived] }
    Campaign:
      type: object
      required: [id, projectId, projectName, name, headline, body, targetUrl, monthlyFee, clickPrice, budget, spent, remainingBudget, status, impressions, clicks, verifiedClicks, createdAt]
      properties:
        id: { type: integer }
        projectId: { type: integer }
        projectName: { type: string }
        name: { type: string }
        headline: { type: string }
        body: { type: string }
        targetUrl: { type: string, format: uri }
        imageUrl: { type: ["string", "null"], format: uri }
        monthlyFee: { type: number, minimum: 0 }
        clickPrice: { type: number, exclusiveMinimum: 0 }
        budget: { type: number, minimum: 0 }
        spent: { type: number, minimum: 0 }
        remainingBudget: { type: number, minimum: 0 }
        status: { type: string, enum: [draft, pending_review, active, paused, expired, rejected] }
        moderationNote: { type: ["string", "null"] }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        verifiedClicks: { type: integer, minimum: 0 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    CampaignInput:
      type: object
      required: [projectId, name, headline, body, targetUrl, monthlyFee, clickPrice]
      properties:
        projectId: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 120 }
        headline: { type: string, minLength: 1, maxLength: 140 }
        body: { type: string, minLength: 1, maxLength: 1000 }
        targetUrl: { type: string, format: uri }
        imageUrl: { type: ["string", "null"], format: uri }
        monthlyFee: { type: number, minimum: 0 }
        clickPrice: { type: number, exclusiveMinimum: 0 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: ["string", "null"], format: date-time }
    CampaignUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        headline: { type: string, minLength: 1, maxLength: 140 }
        body: { type: string, minLength: 1, maxLength: 1000 }
        targetUrl: { type: string, format: uri }
        monthlyFee: { type: number, minimum: 0 }
        clickPrice: { type: number, exclusiveMinimum: 0 }
        status: { type: string, enum: [draft, paused] }
    Placement:
      type: object
      required: [id, ownerId, name, type, address, status, publicKey, impressions, clicks, verifiedClicks, createdAt]
      properties:
        id: { type: integer }
        ownerId: { type: string }
        name: { type: string }
        type: { type: string, enum: [web, android, telegram] }
        address: { type: string }
        status: { type: string, enum: [pending, approved, rejected, paused] }
        publicKey: { type: string }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        verifiedClicks: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
    PlacementInput:
      type: object
      required: [name, type, address]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        type: { type: string, enum: [web, android, telegram] }
        address: { type: string, minLength: 1, maxLength: 500 }
    PlacementUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        address: { type: string, minLength: 1, maxLength: 500 }
        status: { type: string, enum: [paused] }
    Analytics:
      type: object
      required: [range, impressions, clicks, verifiedClicks, publisherEarnings, platformRevenue, clickRate, trend, topCampaigns]
      properties:
        range: { type: string, enum: [7d, 30d, 90d] }
        impressions: { type: integer, minimum: 0 }
        clicks: { type: integer, minimum: 0 }
        verifiedClicks: { type: integer, minimum: 0 }
        publisherEarnings: { type: number, minimum: 0 }
        platformRevenue: { type: number, minimum: 0 }
        clickRate: { type: number, minimum: 0 }
        trend:
          type: array
          items: { $ref: "#/components/schemas/DailyMetric" }
        topCampaigns:
          type: array
          items: { $ref: "#/components/schemas/Campaign" }
    ModerationItem:
      type: object
      required: [campaign, advertiserName]
      properties:
        campaign: { $ref: "#/components/schemas/Campaign" }
        advertiserName: { type: string }
    ModerationDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string, maxLength: 1000 }
    PlatformSettings:
      type: object
      required: [defaultMonthlyFee, defaultClickPrice, publisherSharePercent, platformSharePercent, unusedBudgetPolicy, payoutSchedule]
      properties:
        defaultMonthlyFee: { type: number, minimum: 0 }
        defaultClickPrice: { type: number, exclusiveMinimum: 0 }
        publisherSharePercent: { type: number, minimum: 0, maximum: 100 }
        platformSharePercent: { type: number, minimum: 0, maximum: 100 }
        unusedBudgetPolicy: { type: string, enum: [expire, carry, refund] }
        payoutSchedule: { type: string, enum: [weekly, monthly] }
    PlatformSettingsUpdate:
      type: object
      properties:
        defaultMonthlyFee: { type: number, minimum: 0 }
        defaultClickPrice: { type: number, exclusiveMinimum: 0 }
        publisherSharePercent: { type: number, minimum: 0, maximum: 100 }
        unusedBudgetPolicy: { type: string, enum: [expire, carry, refund] }
        payoutSchedule: { type: string, enum: [weekly, monthly] }
    SdkAd:
      type: object
      required: [campaignId, headline, body, targetUrl, clickToken]
      properties:
        campaignId: { type: integer }
        headline: { type: string }
        body: { type: string }
        targetUrl: { type: string, format: uri }
        imageUrl: { type: ["string", "null"], format: uri }
        clickToken: { type: string }
    SdkAdResponse:
      type: object
      required: [ad]
      properties:
        ad: { oneOf: [{ $ref: "#/components/schemas/SdkAd" }, { type: "null" }] }
    SdkEventInput:
      type: object
      required: [placementKey, campaignId, clickToken, deviceToken]
      properties:
        placementKey: { type: string }
        campaignId: { type: integer, minimum: 1 }
        clickToken: { type: string }
        deviceToken: { type: string, minLength: 8, maxLength: 200 }
    SdkEventResponse:
      type: object
      required: [eventId, status, duplicate]
      properties:
        eventId: { type: string }
        status: { type: string, enum: [pending, recorded, rejected] }
        duplicate: { type: boolean }

